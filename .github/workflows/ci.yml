name: Verifiche

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Codice.gs allineato ai sorgenti
        run: npm run check
      - name: Test del backend (servizi Google simulati)
        run: npm run test:backend
      - name: Test dell'app su computer e telefono
        run: npm run test:e2e
      - name: Schermate dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: test-results/
          retention-days: 7
